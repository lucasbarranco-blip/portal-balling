<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balling LatAm · Pedidos mayoristas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ─────────────────────────────────────────────────────────────
   Tipografía igual a ballinghockey.com.ar:
   · Instrument Sans → títulos, navegación, botones, UI  (Google Fonts, libre)
   · Vaud            → texto corrido y precios            (licenciada, self-hosted)
   Vaud es una tipografía paga: si el representante tiene la licencia,
   subí los .woff2 y descomentá este bloque. Sin eso, todo cae
   automáticamente en Instrument Sans, que es lo que usa el sitio
   en headings, nav y botones.

@font-face{font-family:'Vaud';src:url('fonts/Vaud-Regular.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Vaud';src:url('fonts/Vaud-Medium.woff2') format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
   ───────────────────────────────────────────────────────────── */
:root{
  --ink:#101013; --ink-2:#1B1B20; --paper:#EFEFEC; --card:#FFFFFF;
  --teal:#0E6B63; --teal-d:#0A544E; --ember:#D9451F;
  --mute:#77776F; --line:#DBDBD5; --line-2:#E9E9E4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 14.5px/1.55 'Vaud','Instrument Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
h1,h2,h3,nav,button,th,label,input,select,textarea,.ui{font-family:'Instrument Sans',system-ui,sans-serif}
.m{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.wide{letter-spacing:-.038em}
.lbl{font:500 10px/1 'Instrument Sans';letter-spacing:.13em;text-transform:uppercase}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:var(--teal);color:#fff}

/* ═══ acceso ═══ */
#login{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;grid-template-columns:1fr 1fr}
#login .art{background:var(--ink-2);position:relative;overflow:hidden;display:grid;place-items:center}
#login .art .rings{position:absolute;inset:-30%;background:
  repeating-radial-gradient(circle at 50% 50%, transparent 0 38px, rgba(255,255,255,.045) 38px 39px)}
#login .art .word{position:relative;font-weight:600;font-size:clamp(46px,6.4vw,92px);
  line-height:.98;color:#fff;letter-spacing:-.05em;text-align:center}
#login .art .word em{display:block;font-style:normal;color:var(--teal);font-size:.19em;letter-spacing:.2em;
  font-weight:500;margin-top:22px;text-transform:uppercase}
#login .form{display:grid;place-items:center;padding:32px}
.lbox{width:100%;max-width:330px}
.lbox h2{font-weight:600;font-size:27px;color:#fff;letter-spacing:-.035em}
.lbox p{color:#8A8A82;font-size:13px;margin:8px 0 26px}
.f{margin-bottom:12px}
.f label{display:block;font:500 10px/1 'Instrument Sans';text-transform:uppercase;letter-spacing:.12em;color:#8A8A82;margin-bottom:6px}
.f input{width:100%;padding:11px 12px;background:#000;border:1px solid #2E2E34;color:#fff;border-radius:2px}
.f input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.go{width:100%;padding:12px;background:var(--teal);color:#fff;font-weight:600;border-radius:2px;font-size:14px}
.go:hover{background:var(--teal-d)}
.hint{margin-top:20px;font:400 11px/1.7 'Instrument Sans';color:#6E6E66}
.hint b{color:#C9C9C1;font-weight:500}
#lerr{color:#FF9B7A;font:400 11px/1.6 'Instrument Sans';min-height:18px;margin-top:8px}

/* ═══ chrome ═══ */
#app{display:none;min-height:100%;flex-direction:column}
#app.on{display:flex}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
.hrow{display:flex;align-items:center;gap:26px;padding:0 22px;height:54px}
.logo{font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:-.04em}
.logo i{color:var(--teal);font-style:normal}
.hrow .tag{font:500 9px/1 'Instrument Sans';letter-spacing:.16em;color:#75756D;text-transform:uppercase;
  border-left:1px solid #2E2E34;padding-left:14px;margin-left:-14px}
nav{display:flex;gap:2px;margin-left:14px;height:100%;overflow-x:auto}
nav button{padding:0 13px;color:#9A9A92;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--teal);font-weight:600}
nav .n{font:500 10px/1 'Instrument Sans';background:var(--teal);color:#fff;padding:2px 5px;border-radius:2px;margin-left:6px}
.hright{margin-left:auto;display:flex;align-items:center;gap:16px}
.acct{text-align:right;line-height:1.25}
.acct .a{font-size:12.5px;font-weight:600}
.acct .b{font:400 10px 'Instrument Sans';color:#75756D}
.out{font:500 10px/1 'Instrument Sans';color:#75756D;text-transform:uppercase;letter-spacing:.1em;
  border:1px solid #2E2E34;padding:7px 9px;border-radius:2px}
.out:hover{color:#fff;border-color:#4A4A52}

main{padding:24px 22px 118px;width:100%;max-width:1340px;margin:0 auto;flex:1}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.title .eb{font:500 10px/1 'Instrument Sans';letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.title h1{font-weight:600;font-size:33px;letter-spacing:-.04em;line-height:1.02}
.title .sub{font-size:13px;color:var(--mute);max-width:340px;text-align:right}

.bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input,.bar select{padding:9px 11px;border:1px solid var(--line);background:var(--card);border-radius:2px}
.bar input{flex:1;min-width:190px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--ink)}
.chip{padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:2px;font-size:12.5px;color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.count{font:400 11px 'Instrument Sans';color:var(--mute);margin-left:auto}

/* ═══ modelo ═══ */
.mod{background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.mod.open{border-color:var(--ink)}
.mh{display:grid;grid-template-columns:74px 1fr auto auto;gap:16px;align-items:center;padding:11px 14px;cursor:pointer}
.mh:hover{background:#FAFAF8}
.ph{width:74px;height:74px;background:var(--paper) center/cover no-repeat;border:1px solid var(--line-2)}
.mn{font-weight:600;font-size:17.5px;letter-spacing:-.03em;line-height:1.18}
.specs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.sp{font:500 9.5px/1 'Instrument Sans';letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;
  border:1px solid var(--line);color:var(--mute);border-radius:2px}
.sp.k{border-color:var(--ink);color:var(--ink)}
.sp.e{border-color:var(--ember);color:var(--ember)}
.sp.t{border-color:var(--teal);color:var(--teal);background:#EAF3F1}
.mp{text-align:right;white-space:nowrap}
.mp .may{font-family:'Instrument Sans';font-weight:700;font-size:17px}
.mp .pvp{font:400 10.5px 'Instrument Sans';color:var(--mute);margin-top:3px}
.ar{width:22px;text-align:center;color:var(--mute);font-size:11px;transition:transform .16s}
.mod.open .ar{transform:rotate(90deg);color:var(--ink)}

/* ═══ matriz ═══ */
.mx{display:none;border-top:1px solid var(--line)}
.mod.open .mx{display:block}
.mxs{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
thead th{font:500 9.5px/1 'Instrument Sans';letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  padding:10px 8px;text-align:center;background:#F7F7F4;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l{text-align:left;padding-left:14px}
tbody td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:center}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FCFCFA}
td.l{text-align:left;padding-left:14px}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18);margin-right:8px;vertical-align:-1px}
.rn{font-weight:600;font-size:13.5px}
.rs{font:400 10px 'Instrument Sans';color:var(--mute);margin-top:2px}
td.pr{font-family:'Instrument Sans';font-size:12.5px;white-space:nowrap;text-align:right;font-weight:500}
td.pr small{display:block;color:var(--mute);font-weight:400;font-size:10px}
.q{width:46px;padding:6px 2px;text-align:center;border:1px solid var(--line);background:var(--paper);
  border-radius:2px;font-family:'Instrument Sans';font-weight:700;font-size:13px}
.q:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:#fff}
.q:disabled{opacity:.25;cursor:not-allowed}
.q.has{background:#EAF3F1;border-color:var(--teal);color:var(--teal-d)}
.st{font:400 9px 'Instrument Sans';color:var(--mute);margin-top:3px;display:block}
.st.low{color:var(--ember);font-weight:500}
.st.no{opacity:.35}
td.tt{font-family:'Instrument Sans';font-weight:700;font-size:13px;background:#F7F7F4}
tfoot td{background:#F7F7F4;color:var(--ink);font-family:'Instrument Sans';font-weight:700;font-size:12.5px;
  padding:9px 8px;text-align:center;border-top:1px solid var(--line)}
tfoot td.l{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--mute)}

/* acción por modelo */
.mact{display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
.mact .ms{font:400 11.5px 'Instrument Sans';color:#9A9A92}
.mact .ms b{color:#fff;font-weight:700}
.mact .sp2{margin-left:auto;display:flex;gap:7px}
.add{padding:9px 17px;background:var(--teal);color:#fff;font-weight:600;font-size:13.5px;border-radius:2px}
.add:hover{background:var(--teal-d)}
.add:disabled{background:#2E2E34;color:#6E6E66;cursor:not-allowed}
.und{padding:9px 12px;border:1px solid #2E2E34;color:#9A9A92;border-radius:2px;font-size:12.5px}
.und:hover{color:#fff;border-color:#4A4A52}

.empty{background:var(--card);border:1px solid var(--line);padding:54px 20px;text-align:center}
.empty .t{font-weight:600;font-size:18px;letter-spacing:-.03em}
.empty .d{color:var(--mute);margin-top:7px;max-width:420px;margin-left:auto;margin-right:auto}
.empty button{margin-top:16px;padding:10px 18px;background:var(--ink);color:#fff;border-radius:2px;font-weight:600;font-size:13px}

/* ═══ paneles ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);padding:13px 15px}
.kpi .k{font:500 9.5px/1 'Instrument Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:'Instrument Sans';font-weight:700;font-size:21px;margin-top:9px}
.kpi .v.e{color:var(--ember)} .kpi .v.t{color:var(--teal)}
.panel{background:var(--card);border:1px solid var(--line);overflow-x:auto}
.panel table{min-width:0}
.panel td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.panel th{text-align:left;padding-left:14px}
.panel td.n,.panel th.n{text-align:right;padding-right:14px;font-family:'Instrument Sans';font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:500 9.5px/1 'Instrument Sans';letter-spacing:.08em;text-transform:uppercase;
  padding:5px 7px;border:1px solid var(--line);color:var(--mute);border-radius:2px}
.badge.t{border-color:var(--teal);color:var(--teal);background:#EAF3F1}
.badge.e{border-color:var(--ember);color:var(--ember);background:#FCEEE9}
.badge.k{border-color:var(--ink);color:var(--ink)}
.track{display:flex;gap:2px;width:118px}
.track i{flex:1;height:4px;background:var(--line)}
.track i.d{background:var(--ink)} .track i.c{background:var(--teal)}
.lk{color:var(--teal);font-weight:600;font-size:13.5px}
.lk:hover{color:var(--teal-d)}
.lk.g{color:var(--mute)} .lk.g:hover{color:var(--ember)}

/* ═══ pedido actual ═══ */
.cartwrap{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.grp{border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.gh{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#F7F7F4;border-bottom:1px solid var(--line-2)}
.gh img{width:34px;height:34px;object-fit:cover;border:1px solid var(--line-2)}
.gh .gn{font-weight:600;font-size:14.5px;letter-spacing:-.025em}
.gh .gc{font:400 10px 'Instrument Sans';color:var(--mute);margin-left:auto}
.ln{display:grid;grid-template-columns:1fr 76px 92px 96px 30px;gap:10px;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--line-2)}
.ln:last-child{border-bottom:none}
.ln .d1{font-size:13.5px;font-weight:600}
.ln .d2{font:400 10px 'Instrument Sans';color:var(--mute);margin-top:2px}
.ln .qq{width:100%;padding:6px;text-align:center;border:1px solid var(--line);border-radius:2px;
  font-family:'Instrument Sans';font-weight:700;background:var(--paper)}
.ln .qq:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:#fff}
.ln .p1,.ln .p2{font-family:'Instrument Sans';text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.ln .p1{color:var(--mute)} .ln .p2{font-weight:700}
.ln .x{color:var(--mute);font-size:16px;line-height:1}
.ln .x:hover{color:var(--ember)}
.side{position:sticky;top:70px;display:grid;gap:10px}
.box{background:var(--card);border:1px solid var(--line);padding:15px}
.box h3{font-weight:600;font-size:15px;letter-spacing:-.025em;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.row span:last-child{font-family:'Instrument Sans';font-variant-numeric:tabular-nums}
.row.big{border-top:1px solid var(--line);margin-top:7px;padding-top:10px;font-weight:700;font-size:15px}
.box textarea,.box input,.box select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;
  background:var(--paper);margin-bottom:8px;resize:vertical}
.box textarea:focus,.box input:focus,.box select:focus{outline:none;border-color:var(--teal);background:#fff}
.wfull{width:100%;padding:11px;border-radius:2px;font-weight:600;font-size:13.5px}
.wfull.p{background:var(--teal);color:#fff} .wfull.p:hover{background:var(--teal-d)}
.wfull.p:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.wfull.s{border:1px solid var(--ink);color:var(--ink)} .wfull.s:hover{background:var(--ink);color:#fff}
.warn{font:400 11.5px/1.5 'Instrument Sans';color:var(--ember);margin-bottom:10px}

/* ═══ recurrentes ═══ */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:10px}
.rec{background:var(--card);border:1px solid var(--line);padding:15px;display:flex;flex-direction:column;gap:10px}
.rec .rt{font-weight:600;font-size:17px;letter-spacing:-.03em;line-height:1.22}
.rec .rf{display:flex;gap:5px;flex-wrap:wrap}
.rec .rd{font:400 11.5px/1.6 'Instrument Sans';color:var(--mute)}
.rec .rp{font-family:'Instrument Sans';font-weight:700;font-size:18px}
.rec .ra{display:flex;gap:7px;margin-top:auto;padding-top:4px}
.rec .ra button{flex:1;padding:9px;border-radius:2px;font-size:13px;font-weight:600}
.rec .ra .l{background:var(--teal);color:#fff} .rec .ra .l:hover{background:var(--teal-d)}
.rec .ra .d{border:1px solid var(--line);color:var(--mute);flex:0 0 42px}
.rec .ra .d:hover{border-color:var(--ember);color:var(--ember)}

/* ═══ ticker + toast ═══ */
#tk{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:#fff;transform:translateY(102%);
  transition:transform .22s cubic-bezier(.3,.8,.4,1)}
#tk.on{transform:none}
#tk .prog{height:2px;background:#2E2E34}
#tk .prog i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
#tk .prog i.full{background:var(--ember)}
#tk .in{display:flex;align-items:center;gap:26px;padding:12px 22px;max-width:1340px;margin:0 auto;flex-wrap:wrap}
#tk .u{white-space:nowrap}
#tk .u .k{font:500 9px/1 'Instrument Sans';letter-spacing:.16em;text-transform:uppercase;color:#75756D}
#tk .u .v{font-family:'Instrument Sans';font-weight:700;font-size:18px;margin-top:5px}
#tk .u .v.big{font-size:22px}
#tk .note{font:400 11.5px/1.4 'Instrument Sans';color:#E8A78C;flex:1;min-width:160px}
#tk .acts{margin-left:auto;display:flex;gap:7px}
.ghost{padding:10px 13px;border:1px solid #2E2E34;color:#9A9A92;border-radius:2px;font-size:12.5px}
.ghost:hover{color:#fff;border-color:#4A4A52}
.send{padding:10px 20px;background:var(--teal);color:#fff;font-weight:600;border-radius:2px;font-size:13.5px}
.send:hover{background:var(--teal-d)}
#toast{position:fixed;right:22px;bottom:96px;z-index:60;display:grid;gap:7px;pointer-events:none}
.ts{background:var(--ink);color:#fff;border-left:3px solid var(--teal);padding:11px 15px;border-radius:2px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.22);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

@media(max-width:980px){ .cartwrap{grid-template-columns:1fr} .side{position:static} }
@media(max-width:900px){
  #login{grid-template-columns:1fr} #login .art{display:none}
  .hrow{height:auto;flex-wrap:wrap;padding:12px 14px;gap:12px}
  nav{order:3;width:100%;margin:0} .hright{margin-left:auto}
  main{padding:16px 12px 150px}
  .title .sub{display:none}
  .mh{grid-template-columns:54px 1fr auto;gap:11px} .ph{width:54px;height:54px}
  .mp{grid-column:2/4;text-align:left} .ar{display:none}
  .ln{grid-template-columns:1fr 64px 84px 26px;gap:8px} .ln .p1{display:none}
  #toast{right:12px;left:12px;bottom:150px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="art"><div class="rings"></div><div class="word">Pedidos<br>Mayoristas<em>Latinoamérica</em></div></div>
  <div class="form"><div class="lbox">
    <h2>Acceso distribuidores</h2>
    <p>Cargá tu pedido con precios mayoristas, stock en vivo y cuenta corriente.</p>
    <div class="f"><label>Email</label><input id="em" type="email" autocomplete="username" placeholder="pedidos@tuempresa.com"></div>
    <div class="f"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="go" onclick="entrar()">Entrar</button>
    <div id="lerr"></div>
    <div class="hint">Demo — <b>demo</b> / <b>demo</b> como mayorista.<br><b>admin</b> / <b>admin</b> para el panel del representante.</div>
  </div></div>
</div>

<div id="app">
  <header><div class="hrow">
    <div class="logo">Balling<i>.</i></div>
    <div class="tag">B2B LatAm</div>
    <nav id="nav"></nav>
    <div class="hright">
      <div class="acct"><div class="a" id="who"></div><div class="b" id="sub"></div></div>
      <button class="out" onclick="location.reload()">Salir</button>
    </div>
  </div></header>
  <main id="view"></main>
</div>

<div id="tk">
  <div class="prog"><i id="pf"></i></div>
  <div class="in">
    <div class="u"><div class="k">Unidades</div><div class="v" id="tu">0</div></div>
    <div class="u"><div class="k">SKUs</div><div class="v" id="ts">0</div></div>
    <div class="u"><div class="k">Neto mayorista</div><div class="v" id="tn">$0</div></div>
    <div class="u"><div class="k">Total c/IVA</div><div class="v big" id="tt">$0</div></div>
    <div class="note" id="tmsg"></div>
    <div class="acts">
      <button class="ghost" onclick="vaciar()">Vaciar</button>
      <button class="send" onclick="ir('pedido')">Ver pedido</button>
    </div>
  </div>
</div>
<div id="toast"></div>

/* ═══ acceso ═══ */
async function entrar(){
  const e=$('em').value.trim(), p=$('pw').value;
  if(DEMO){
    if(e==='admin'&&p==='admin'){S={rol:'admin',n:'Representante LatAm',s:'Panel interno'};return abrir();}
    if(e==='demo'&&p==='demo'){S={rol:'may',n:CLI.razon,s:'CUIT '+CLI.cuit};return abrir();}
    $('lerr').textContent='Usuario o contraseña incorrectos. Probá demo / demo.';return;
  }
  const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error){$('lerr').textContent='No pudimos entrar: revisá el email y la contraseña.';return;}
  const {data:pf}=await sb.from('perfiles').select('rol').eq('id',data.user.id).single();
  S={rol:pf?.rol==='admin'?'admin':'may',n:data.user.email,s:''};
  abrir();
}
function abrir(){
  $('login').style.display='none'; $('app').classList.add('on');
  $('who').textContent=S.n; $('sub').textContent=S.s;
  nav(); ir(S.rol==='admin'?'entrantes':'catalogo');
}

  const nu=Object.keys(cart).length;
  $('nav').innerHTML=TABS[S.rol].map(([k,l])=>

}

let fCat='', fCol='', fStk=false;
function vCatalogo(){
  const cats=[...new Set(CAT.map(m=>m.cat))], cols=[...new Set(CAT.map(m=>m.col))];
  $('view').innerHTML=`
  <div class="title">
    <div><div class="eb">Temporada 2026 · Lista mayorista vigente</div><h1 class="wide">Catálogo</h1></div>
    <div class="sub">Escribí cantidades sobre la grilla de talles y tocá <b>Agregar al pedido</b>. Los precios mayoristas ya tienen el descuento aplicado, sin IVA.</div>
  </div>
  <div class="bar">
    <input id="q" placeholder="Buscar modelo, colorway o SKU" oninput="pintar()">
    <select onchange="fCat=this.value;pintar()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${c===fCat?'selected':''}>${c}</option>`).join('')}</select>
    <select onchange="fCol=this.value;pintar()"><option value="">Todas las colecciones</option>${cols.map(c=>`<option ${c===fCol?'selected':''}>${c}</option>`).join('')}</select>
    <button class="chip ${fStk?'on':''}" onclick="fStk=!fStk;pintar()">Solo con stock</button>
    <span class="count" id="cnt"></span>
  </div>
  <div id="lista"></div>`;
  pintar();
}
function pintar(){
  const q=($('q')?.value||'').toLowerCase().trim();
  const l=CAT.filter(m=>{
    if(fCat&&m.cat!==fCat) return false;
    if(fCol&&m.col!==fCol) return false;
    if(fStk&&!m.filas.some(f=>Object.values(f.stock).some(s=>s>0))) return false;
    if(!q) return true;
    return (m.nombre+' '+m.col+' '+m.filas.map(f=>f.n+' '+f.sku).join(' ')).toLowerCase().includes(q);
  });
  $('cnt').textContent=l.length+' modelos · '+l.reduce((a,m)=>a+m.filas.length*m.talles.length,0)+' SKUs';
  $('lista').innerHTML = l.length? l.map(card).join('') :
    `<div class="empty"><div class="t">Sin resultados</div><div class="d">Probá con otro modelo, colorway o SKU.</div>
     <button onclick="fCat='';fCol='';fStk=false;ir('catalogo')">Limpiar filtros</button></div>`;
}
const enCart=m=>m.filas.reduce((a,f)=>a+m.talles.reduce((b,t)=>b+(cart[f.sku+'|'+t]||0),0),0);
const enGrilla=m=>m.filas.reduce((a,f)=>a+m.talles.reduce((b,t)=>b+val(f.sku+'|'+t),0),0);
const netoGrilla=m=>m.filas.reduce((a,f)=>a+m.talles.reduce((b,t)=>b+val(f.sku+'|'+t)*f.may,0),0);

          <span class="sp">${m.filas.length} colorway${m.filas.length>1?'s':''} · ${m.talles.length} talle${m.talles.length>1?'s':''}</span>
          ${stk===0?'<span class="sp e">Sin stock</span>':stk<20?'<span class="sp e">Stock bajo</span>':''}

        </div>
      </div>
      <div class="mp"><div class="may">${min===max?money(min):money(min)+' – '+money(max)}</div>
        <div class="pvp">PVP ${min===max?money(m.filas[0].pvp):'desde '+money(Math.min(...m.filas.map(f=>f.pvp)))}</div></div>

    const rt=m.talles.reduce((a,t)=>a+val(f.sku+'|'+t),0);
    return `<tr>
      <td class="l"><span class="sw" style="background:${col(f.n)}"></span>

      ${m.talles.map(t=>{const k=f.sku+'|'+t,s=f.stock[t],v=val(k);
        return `<td><input class="q ${v?'has':''}" type="number" min="0" max="${s}" value="${v||''}" placeholder="0"
          ${s?'':'disabled'} onclick="event.stopPropagation()" oninput="setq('${esc(k)}',this)">

}
function accion(m){
  const u=enGrilla(m), ya=enCart(m);
  return `<div class="mact" id="ac-${m.id}">
    <div class="ms" id="ms-${m.id}"><b>${u}</b> unidades · <b>${money(netoGrilla(m))}</b> neto${ya?` · ${ya} ya en el pedido`:''}</div>
    <div class="sp2">
      ${ya?`<button class="und" onclick="quitarMod('${m.id}')">Quitar del pedido</button>`:''}
      <button class="add" id="ad-${m.id}" onclick="commit('${m.id}')" ${u?'':'disabled'}>${ya?'Actualizar pedido':'Agregar al pedido'}</button>

function ab(id){ $('md-'+id).classList.toggle('open'); }
function setq(k,el){
  const {m,f,t}=find(k); let n=parseInt(el.value||0,10); if(isNaN(n)||n<0)n=0;
  if(n>f.stock[t]){n=f.stock[t];el.value=n;}
  draft[k]=n; el.classList.toggle('has',!!n);
  $('rt-'+f.sku).textContent=m.talles.reduce((a,x)=>a+val(f.sku+'|'+x),0)||'';
  $('ct-'+m.id+'-'+t.replace(/\W/g,'')).textContent=m.filas.reduce((a,x)=>a+val(x.sku+'|'+t),0)||'';
  $('mt-'+m.id).textContent=enGrilla(m)||'';
  const u=enGrilla(m), ya=enCart(m);
  $('ms-'+m.id).innerHTML=`<b>${u}</b> unidades · <b>${money(netoGrilla(m))}</b> neto${ya?` · ${ya} ya en el pedido`:''}`;
  $('ad-'+m.id).disabled=!u && !ya;

function commit(id){
  const m=CAT.find(x=>x.id===id); let n=0;
  m.filas.forEach(f=>m.talles.forEach(t=>{
    const k=f.sku+'|'+t, v=val(k);
    if(v>0){cart[k]=v;n+=v;} else delete cart[k];
    delete draft[k];
  }));
  toast(n?`${m.nombre}: ${n} unidades en el pedido`:`${m.nombre} quitado del pedido`);
  nav(); pintar(); ticker();
}
function quitarMod(id){
  const m=CAT.find(x=>x.id===id);
  m.filas.forEach(f=>m.talles.forEach(t=>{delete cart[f.sku+'|'+t];delete draft[f.sku+'|'+t];}));
  toast(`${m.nombre} quitado del pedido`); nav(); pintar(); ticker();
}
function vaciar(){ if(!Object.keys(cart).length)return; cart={}; draft={}; toast('Pedido vaciado'); nav(); ir(tab); }

function totales(){
  let u=0,neto=0;
  for(const k in cart){ const r=find(k); if(!r)continue; u+=cart[k]; neto+=cart[k]*r.f.may; }
  return {u,skus:Object.keys(cart).length,neto,total:neto*(1+IVA)};
}
function ticker(){
  const t=totales(), el=$('tk');
  if(!t.u||S.rol==='admin'){el.classList.remove('on');return;}
  el.classList.add('on');
  $('tu').textContent=t.u; $('ts').textContent=t.skus;
  $('tn').textContent=money(t.neto); $('tt').textContent=money(t.total);
  const falta=CLI.minimo-t.neto, cred=CLI.limite-saldo();
  const pf=$('pf'); pf.style.width=Math.min(t.neto/CLI.minimo,1)*100+'%';
  pf.classList.toggle('full',t.total>cred);
  $('tmsg').textContent = falta>0 ? `Faltan ${money(falta)} para el mínimo de ${money(CLI.minimo)}.`
    : t.total>cred ? `Excede tu crédito disponible (${money(cred)}).` : '';

function setLn(k,el){
  const r=find(k); let n=parseInt(el.value||0,10); if(isNaN(n)||n<1)n=1;

  cart[k]=n; vPedido(); ticker();
}
function quitarLn(k){ delete cart[k]; delete draft[k]; nav(); vPedido(); ticker(); }

async function enviar(){
  const t=totales(); if(!t.u) return;
  const items=Object.keys(cart).map(k=>{const{m,f,t:tl}=find(k);
    return{sku:f.sku+'-'+tl,desc:`${m.nombre} ${f.n} ${tl}`,cant:cart[k],precio:f.may,sub:cart[k]*f.may};});
  if(!DEMO){
    const {data:p,error}=await sb.from('pedidos').insert({cliente_id:CLI.id,estado:'enviado',
      notas:$('notas')?.value||null}).select().single();
    if(error){toast('No se pudo enviar el pedido. Reintentá en unos segundos.');return;}
    await sb.from('pedido_items').insert(items.map(i=>({pedido_id:p.id,sku:i.sku,descripcion:i.desc,
      cantidad:i.cant,precio_unit:i.precio,subtotal:i.sub})));
  }
  const num=Math.max(...PED.map(p=>p.n))+1;
  PED.unshift({n:num,f:new Date().toISOString().slice(0,10),e:'enviado',t:t.total,u:t.u,items:{...cart}});
  cart={}; draft={}; toast('Pedido #'+num+' enviado'); nav(); ir('pedidos');
}

const recU=r=>Object.values(r.items).reduce((a,b)=>a+b,0);

}
function cargarRec(id){
  const r=REC.find(x=>x.id===id); let ajust=0, ok=0;
  Object.entries(r.items).forEach(([k,q])=>{
    const x=find(k); if(!x) return;
    const s=x.f.stock[x.t]; if(s<=0) {ajust++; return;}
    if(q>s){q=s;ajust++;}
    cart[k]=q; ok++;
  });
  r.ultimo=new Date().toISOString().slice(0,10);
  toast(ajust?`${ok} líneas cargadas · ${ajust} ajustadas por stock`:`${ok} líneas cargadas en el pedido`);
  nav(); ir('pedido');
}

function duplicar(n){
  const p=PED.find(x=>x.n===n); let ajust=0, ok=0;
  Object.entries(p.items||{}).forEach(([k,q])=>{
    const x=find(k); if(!x) return;
    const s=x.f.stock[x.t]; if(s<=0){ajust++;return;}
    if(q>s){q=s;ajust++;}
    cart[k]=Math.min((cart[k]||0)+q, s); ok++;

    <tr><td style="font-weight:600">${CLI.razon}</td><td class="m">${CLI.cuit}</td>
    <td class="n" style="font-weight:700">${money(s)}</td><td class="n">${money(CLI.limite)}</td>
    <td class="n">${money(CLI.limite-s)}</td>
    <td><span class="badge ${s>CLI.limite?'e':'t'}">${s>CLI.limite?'Excedido':'Al día'}</span></td></tr>
  </tbody></table></div>`;
}
const V={catalogo:vCatalogo,pedido:vPedido,recurrentes:vRecurrentes,pedidos:vPedidos,cuenta:vCuenta,
  envios:()=>vEnvios(), entrantes:vEntrantes,stock:vStock,cuentas:vCuentas,logistica:()=>vEnvios('Logística','Despachos')};
